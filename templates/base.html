<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Flask Template Inheritance{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>{% block heading %}{% endblock %}</header>
    <nav>
      <a href="{{ url_for('home') }}"><button>Home</button></a>
      <a href="{{ url_for('about') }}"><button>About</button></a>
      <a href="{{ url_for('contact') }}"><button>Contact</button></a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <footer>&copy;This is a footer</footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
